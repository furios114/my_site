<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>west — Python / JS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #08080a;
    --card: #101013;
    --border: #1c1c21;
    --text: #ededf0;
    --muted: #85858f;
    --dim: #55555e;
    --accent: #ffffff;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(120,120,255,0.10), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .card {
    max-width: 540px;
    width: 100%;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.8s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo-wrap {
    width: 104px;
    height: 104px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 24px;
    position: relative;
    transition: transform 0.3s ease, border-color 0.3s ease;
    overflow: hidden;
  }
  .logo-wrap:hover {
    transform: translateY(-2px);
    border-color: #2a2a32;
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  h1 {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
    background: linear-gradient(180deg, #ffffff, #b8b8c0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 0 0 rgba(61,220,132,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61,220,132,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(61,220,132,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); }
  }
  .subtitle {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 36px;
  }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--dim);
    margin-bottom: 14px;
    font-weight: 600;
  }
  .services {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 32px;
  }
  .service {
    padding: 15px 18px;
    background: linear-gradient(180deg, #121216, #0e0e11);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.25s ease, transform 0.25s ease, background 0.25s ease;
    animation: fadeUp 0.6s ease both;
  }
  .service:nth-child(1) { animation-delay: 0.05s; }
  .service:nth-child(2) { animation-delay: 0.10s; }
  .service:nth-child(3) { animation-delay: 0.15s; }
  .service:nth-child(4) { animation-delay: 0.20s; }
  .service:nth-child(5) { animation-delay: 0.25s; }
  .service:hover {
    border-color: #2e2e37;
    transform: translateY(-2px);
    background: linear-gradient(180deg, #17171c, #121216);
  }
  .service .bullet {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3a3a44;
    flex-shrink: 0;
    transition: background 0.25s ease;
  }
  .service:hover .bullet { background: #7a7aff; }
  .buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 22px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    text-decoration: none;
    transition: transform 0.2s ease, opacity 0.2s ease, background 0.2s ease;
    border: 1px solid transparent;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--accent);
    color: #08080a;
  }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  .btn-secondary:hover {
    border-color: #2e2e37;
    background: #121216;
  }
  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    .logo-wrap { width: 88px; height: 88px; }
    .buttons { flex-direction: column; }
    .btn { justify-content: center; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img src="https://i.ibb.co/KBDr7cH/bf3ea6bf80b1ad639c8c20ae66ddf6aa.jpg" alt="west">
    </div>

    <span class="status"><span class="dot"></span> Доступен для заказов</span>
    <h1>west</h1>
    <p class="subtitle">Python / JavaScript — боты, парсеры, скрипты</p>

    <p class="section-title">Что делаю</p>
    <div class="services">
      <div class="service"><span class="bullet"></span> Telegram-боты на Python</div>
      <div class="service"><span class="bullet"></span> Парсинг сайтов и каналов</div>
      <div class="service"><span class="bullet"></span> Скрипты и автоматизация</div>
      <div class="service"><span class="bullet"></span> Сайты и лендинги</div>
      <div class="service"><span class="bullet"></span> Мелкие задачи на JavaScript</div>
    </div>

    <p class="section-title">Примеры</p>
    <div class="services">
      <div class="service"><span class="bullet"></span> Скоро здесь появятся работы</div>
    </div>

    <div class="buttons">
      <a class="btn btn-primary" href="https://t.me/west_coder">Написать в Telegram →</a>
      <a class="btn btn-secondary" href="https://github.com/furios114">GitHub</a>
    </div>
  </div>
</body>
</html>
